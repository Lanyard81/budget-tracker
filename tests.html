<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracker tests</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; padding: 16px; }
    #summary { font-size: 1.4rem; font-weight: 700; padding: 12px; border-radius: 8px; }
    .allpass { background: #d6f5e0; color: #0a5c26; } .somefail { background: #fdeceb; color: #b42318; }
    ul { padding-left: 0; list-style: none; } li { padding: 2px 0; }
    .pass { color: #0a7d33; } .fail { color: #b42318; font-weight: 700; }
  </style>
</head>
<body>
<h1>Budget Tracker self-check</h1>
<p id="summary">Running…</p>
<ul id="out"></ul>
<script type="module">
  import { runTests } from './js/tests-core.js';
  // Fails loudly: any failed check turns the page red, logs an error and throws.
  const results = runTests();
  const ul = document.getElementById('out');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? '✔ ' : '✘ ') + r.name + (r.ok ? '' : ' — ' + r.detail);
    ul.appendChild(li);
  }
  const failed = results.filter((r) => !r.ok);
  const s = document.getElementById('summary');
  s.textContent = failed.length ? `${failed.length} of ${results.length} FAILED` : `All ${results.length} tests passed`;
  s.className = failed.length ? 'somefail' : 'allpass';
  document.title = (failed.length ? 'FAIL' : 'PASS') + ' — Budget Tracker tests';
  if (failed.length) { console.error('TESTS FAILED', failed); throw new Error(failed.length + ' test(s) failed'); }
  console.log(`All ${results.length} tests passed`);
</script>
</body>
</html>
